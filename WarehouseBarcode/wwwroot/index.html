<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仓库条码管理系统</title><style>body{font:14px system-ui;margin:0;background:#f4f6f8;color:#17202a}.top{background:#15324b;color:#fff;padding:20px max(16px,calc((100% - 1120px)/2));display:flex;justify-content:space-between}.top b{font-size:20px}.wrap{max-width:1120px;margin:24px auto;padding:0 16px}.cards,.grid{display:grid;gap:12px}.cards{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:1fr 1fr}.box{background:#fff;border:1px solid #dce4e9;border-radius:8px;padding:16px;margin-bottom:16px}.cards .box{margin:0}strong{display:block;font-size:28px;margin-top:5px}nav{display:flex;gap:6px;overflow:auto;margin:20px 0}button,input,select{font:inherit;padding:8px;border-radius:4px;border:1px solid #c8d3dc}button{background:#1769aa;color:#fff;border:0;cursor:pointer}nav button.active{background:#0b756d}.view{display:none}.view.active{display:block}.tools{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.tools>*{margin:0}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid #edf0f2;padding:8px}th{color:#607284;font-weight:500}.scroll{overflow:auto}.msg{min-height:22px;color:#0b756d}.danger{background:#a5362b}.muted{color:#607284;font-size:13px}@media(max-width:720px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><b>仓库条码管理系统</b><small>库存作业中心 · V1.0</small></header><main class="wrap"><section class="cards"><div class="box">在用商品<strong id="pc">-</strong></div><div class="box">仓库<strong id="wc">-</strong></div><div class="box">往来单位<strong id="bc">-</strong></div><div class="box">低库存<strong id="lc">-</strong></div></section><nav><button class="active" data-tab="ops">库存作业</button><button data-tab="master">基础资料</button><button data-tab="txs">业务流水</button><button data-tab="stocktake">库存盘点</button><button data-tab="transfer">仓库调拨</button><button data-tab="account">账户</button></nav><section id="ops" class="view active"><div class="grid"><div class="box"><h3>库存查询</h3><div class="tools"><input id="q" placeholder="扫描条码 / SKU / 品名"><button id="searchBtn">查询</button><button id="stockExport">导出库存</button></div><div class="scroll"><table><thead><tr><th>商品</th><th>条码</th><th>仓库</th><th>数量</th></tr></thead><tbody id="st"></tbody></table></div></div><div class="box"><h3>快速库存业务</h3><div class="tools"><select id="tt"><option>入库</option><option>出库</option><option>退货入库</option></select><select id="p"></select><select id="w"></select><input id="qty" type="number" value="1" min=".01" step=".01"><input id="rm" placeholder="备注"><button id="txBtn">提交</button></div><p class="muted">条码枪按键盘输入后可直接回车查询。出库不足会自动拒绝。</p><h3>最近流水</h3><table><tbody id="recent"></tbody></table></div></div></section><section id="master" class="view"><div class="box"><h3>商品</h3><div class="tools"><input id="sku" placeholder="SKU"><input id="bar" placeholder="条码"><input id="name" placeholder="名称"><input id="unit" value="件" placeholder="单位"><input id="safe" type="number" value="0" placeholder="安全库存"><button id="addP">新增商品</button></div><div class="scroll"><table><thead><tr><th>SKU</th><th>条码</th><th>商品</th><th>安全库存</th><th>操作</th></tr></thead><tbody id="pt"></tbody></table></div></div><div class="box"><h3>仓库</h3><div class="tools"><input id="code" placeholder="编码"><input id="wn" placeholder="名称"><input id="addr" placeholder="地址"><button id="addW">新增仓库</button></div><table><thead><tr><th>编码</th><th>名称</th><th>地址</th><th>操作</th></tr></thead><tbody id="wt"></tbody></table></div><div class="box"><h3>往来单位</h3><div class="tools"><input id="pcod" placeholder="编码"><input id="pn" placeholder="名称"><select id="ptype"><option>客户/供应商</option><option>客户</option><option>供应商</option></select><button id="addB">新增单位</button></div><table><thead><tr><th>编码</th><th>名称</th><th>类别</th></tr></thead><tbody id="bt"></tbody></table></div></section><section id="txs" class="view box"><h3>业务流水</h3><div class="tools"><select id="tf"><option value="">全部类型</option><option>入库</option><option>出库</option><option>退货入库</option><option>盘点调整</option><option>调拨入库</option><option>调拨出库</option></select><input id="tq" placeholder="单号 / 商品 / 备注"><button id="txSearch">筛选</button><button id="txExport">导出流水</button></div><div class="scroll"><table><thead><tr><th>时间</th><th>单号</th><th>类型</th><th>商品</th><th>仓库</th><th>数量</th><th>备注</th></tr></thead><tbody id="tlist"></tbody></table></div></section><section id="stocktake" class="view box"><h3>库存盘点</h3><p class="muted">输入实盘数量，系统记录盘点前、盘点后和差异。</p><div class="tools"><select id="sp"></select><select id="sw"></select><input id="actual" type="number" min="0" step=".01" placeholder="实盘数量"><input id="sr" placeholder="备注"><button id="stBtn">确认盘点</button></div></section><section id="transfer" class="view box"><h3>仓库调拨</h3><div class="tools"><select id="tp"></select><select id="from"></select><select id="to"></select><input id="tqty" type="number" min=".01" step=".01" placeholder="数量"><input id="tr" placeholder="备注"><button id="trBtn">提交调拨</button></div></section><section id="account" class="view box"><h3>账户登录</h3><p class="muted">请使用系统分配的账号登录。</p><div class="tools"><input id="user" placeholder="用户名"><input id="pass" type="password" placeholder="密码"><button id="login">登录</button></div></section><p id="msg" class="msg"></p></main><script>const $=id=>document.getElementById(id);const json=async(u,o)=>{let r=await fetch(u,o);if(!r.ok)throw Error((await r.text())||('HTTP '+r.status));return r.status===204?null:r.json()};const say=x=>{$('msg').textContent=x;setTimeout(()=>$('msg').textContent='',3000)};let products=[],warehouses=[],lastStock=[],lastTx=[];document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$(b.dataset.tab).classList.add('active');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.tab==='master')masters();if(b.dataset.tab==='txs')transactions()});async function load(){let d=await json('/api/dashboard');$('pc').textContent=d.products;$('wc').textContent=d.warehouses;$('bc').textContent=d.partners;$('lc').textContent=d.lowStock;$('recent').innerHTML=d.recent.map(x=>`<tr><td>${x.type}</td><td>${x.product}</td><td>${x.quantity}</td></tr>`).join('');products=await json('/api/products');warehouses=await json('/api/warehouses');['p','sp','tp'].forEach(id=>$(id).innerHTML=products.map(x=>`<option value="${x.id}">${x.sku} · ${x.name}</option>`).join(''));['w','sw','from','to'].forEach(id=>$(id).innerHTML=warehouses.map(x=>`<option value="${x.id}">${x.name}</option>`).join(''));stock()}function csv(v){return '"'+String(v??'').replaceAll('"','""')+'"'}function download(rows,name){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.join('\n')],{type:'text/csv;charset=utf-8'}));a.download=name;a.click()}async function stock(){let q=$('q').value.toLowerCase(),r=await json('/api/stock');lastStock=r.filter(x=>!q||[x.sku,x.barcode,x.product].some(v=>v.toLowerCase().includes(q)));$('st').innerHTML=lastStock.map(x=>`<tr><td>${x.product}<br><small>${x.sku}</small></td><td>${x.barcode}</td><td>${x.warehouse}</td><td>${x.quantity} ${x.unit}</td></tr>`).join('')}$('searchBtn').onclick=stock;$('q').onkeydown=e=>e.key==='Enter'&&stock();$('stockExport').onclick=()=>download(['商品,SKU,条码,仓库,数量,单位',...lastStock.map(x=>[x.product,x.sku,x.barcode,x.warehouse,x.quantity,x.unit].map(csv).join(','))],'库存.csv');$('txBtn').onclick=async()=>{try{await json('/api/transactions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:$('tt').value,productId:+$('p').value,warehouseId:+$('w').value,quantity:+$('qty').value,remark:$('rm').value})});say('业务已提交');load()}catch(e){say(e.message)}};async function masters(){let [p,w,b]=await Promise.all([json('/api/products'),json('/api/warehouses'),json('/api/partners')]);$('pt').innerHTML=p.map(x=>`<tr><td>${x.sku}</td><td>${x.barcode}</td><td>${x.name}</td><td>${x.safetyStock}</td><td><button class="danger" onclick="deactivate('products',${x.id})">停用</button></td></tr>`).join('');$('wt').innerHTML=w.map(x=>`<tr><td>${x.code}</td><td>${x.name}</td><td>${x.address||''}</td><td><button class="danger" onclick="deactivate('warehouses',${x.id})">停用</button></td></tr>`).join('');$('bt').innerHTML=b.map(x=>`<tr><td>${x.code}</td><td>${x.name}</td><td>${x.type}</td></tr>`).join('')}window.deactivate=async(type,id)=>{try{await json('/api/'+type+'/'+id,{method:'DELETE'});say('已停用');load();masters()}catch(e){say(e.message)}};$('addP').onclick=async()=>{try{await json('/api/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sku:$('sku').value,barcode:$('bar').value,name:$('name').value,unit:$('unit').value,safetyStock:+$('safe').value})});say('商品已新增');load();masters()}catch(e){say(e.message)}};$('addW').onclick=async()=>{try{await json('/api/warehouses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('code').value,name:$('wn').value,address:$('addr').value})});say('仓库已新增');load();masters()}catch(e){say(e.message)}};$('addB').onclick=async()=>{try{await json('/api/partners',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code:$('pcod').value,name:$('pn').value,type:$('ptype').value})});say('单位已新增');masters()}catch(e){say(e.message)}};async function transactions(){let r=await json('/api/transactions'),f=$('tf').value,q=$('tq').value.toLowerCase();lastTx=r.filter(x=>(!f||x.type===f)&&(!q||[x.documentNo,x.product,x.remark].some(v=>(v||'').toLowerCase().includes(q))));$('tlist').innerHTML=lastTx.map(x=>`<tr><td>${new Date(x.occurredAt).toLocaleString()}</td><td>${x.documentNo}</td><td>${x.type}</td><td>${x.product}</td><td>${x.warehouse}</td><td>${x.quantity}</td><td>${x.remark||''}</td></tr>`).join('')}$('txSearch').onclick=transactions;$('txExport').onclick=()=>download(['时间,单号,类型,商品,仓库,数量,备注',...lastTx.map(x=>[x.occurredAt,x.documentNo,x.type,x.product,x.warehouse,x.quantity,x.remark].map(csv).join(','))],'业务流水.csv');$('stBtn').onclick=async()=>{try{let r=await json('/api/stocktakes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:+$('sp').value,warehouseId:+$('sw').value,actual:+$('actual').value,remark:$('sr').value})});say('盘点完成，差异 '+r.difference);load()}catch(e){say(e.message)}};$('trBtn').onclick=async()=>{try{if($('from').value===$('to').value)throw Error('来源仓库和目标仓库不能相同');await json('/api/transfers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:+$('tp').value,fromWarehouseId:+$('from').value,toWarehouseId:+$('to').value,quantity:+$('tqty').value,remark:$('tr').value})});say('调拨已提交');load()}catch(e){say(e.message)}};$('login').onclick=async()=>{try{let r=await json('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('user').value,password:$('pass').value})});say('登录成功：'+r.username+' / '+r.role)}catch(e){say('用户名或密码错误')}};load()</script></body></html>
