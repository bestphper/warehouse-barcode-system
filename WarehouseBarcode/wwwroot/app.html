<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>仓库条码管理系统</title><style>body{margin:0;background:#f4f6f8;color:#17202a;font:14px system-ui}.top{height:64px;background:#15324b;color:#fff;display:flex;align-items:center;padding:0 max(16px,calc((100% - 1160px)/2));gap:25px}.top b{font-size:19px}.menu{display:flex;gap:3px;flex:1;overflow:auto}.menu button{background:transparent;color:#c9d9e2;border:0;padding:22px 10px;white-space:nowrap}.menu button.active,.menu button:hover{background:#234f6b;color:#fff}.user button{background:transparent;border:1px solid #9db9c5;color:#fff;padding:6px;border-radius:4px}.main{max-width:1160px;margin:24px auto;padding:0 16px}.page{display:none}.page.active{display:block}.cards,.grid{display:grid;gap:14px}.cards{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:1fr 1fr}.box{background:#fff;border:1px solid #dce4e9;border-radius:8px;padding:18px;margin-bottom:14px}.value{font-size:30px;font-weight:700;display:block;margin-top:7px}.tools{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.tools>*{padding:8px;border:1px solid #ccd8df;border-radius:4px;font:inherit}.tools button{background:#1769aa;color:#fff;border:0}.table{width:100%;border-collapse:collapse}.table td,.table th{text-align:left;padding:8px;border-bottom:1px solid #edf0f2}.bar{height:15px;background:#e7eef2;border-radius:8px;margin:6px 0 12px}.bar i{display:block;height:100%;background:#1b8394;border-radius:8px}.msg{color:#0b756d;min-height:22px}@media(max-width:800px){.top{height:auto;flex-wrap:wrap;padding:12px 16px}.menu{order:3;width:100%}.menu button{padding:10px}.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}
</style><header class="top"><b><i data-lucide="boxes"></i> 仓库条码管理系统</b><nav class="menu"><button class="active" data-page="home"><i data-lucide="layout-dashboard"></i>首页</button><button data-page="ops"><i data-lucide="scan-barcode"></i>库存作业</button><button data-page="master"><i data-lucide="database"></i>基础资料</button><button data-page="txs"><i data-lucide="list"></i>业务流水</button><button data-page="stocktake"><i data-lucide="clipboard-check"></i>库存盘点</button><button data-page="transfer"><i data-lucide="arrow-left-right"></i>仓库调拨</button><button data-page="account"><i data-lucide="user-round"></i>账户</button></nav><span class="user"><span id="who"></span><button id="out" class="icon-button"><i data-lucide="log-out"></i>退出</button></span></header><main class="main"><section id="home" class="page active"><div class="cards"><div class="box">在用商品<span id="pc" class="value">-</span></div><div class="box">仓库数量<span id="wc" class="value">-</span></div><div class="box">往来单位<span id="bc" class="value">-</span></div><div class="box">低库存预警<span id="lc" class="value">-</span></div></div><div class="grid"><div class="box"><h3>仓库库存分布</h3><div id="warehouses"></div></div><div class="box"><h3>近七日业务趋势</h3><div id="trend" style="display:flex;align-items:end;height:150px;gap:8px"></div></div></div><div class="box"><h3>低库存提醒</h3><div id="alerts">暂无</div></div></section><section id="ops" class="page"><div class="box"><h2>库存作业</h2><div class="tools"><input id="q" placeholder="条码 / SKU / 品名"><button id="search">查询</button><select id="type"><option>入库</option><option>出库</option><option>退货入库</option></select><select id="product"></select><select id="warehouse"></select><input id="quantity" type="number" value="1" min=".01"><input id="remark" placeholder="备注"><button id="submit">提交</button></div><table class="table"><tbody id="stock"></tbody></table></div></section><section id="master" class="page"><div class="box"><h2>基础资料</h2><p>商品、仓库和往来单位维护入口。</p><table class="table"><tbody id="masters"></tbody></table></div></section><section id="txs" class="page"><div class="box"><h2>业务流水</h2><div class="tools"><select id="filter"><option value="">全部</option><option>入库</option><option>出库</option><option>盘点调整</option><option>调拨入库</option><option>调拨出库</option></select><button id="reloadTx">刷新</button></div><table class="table"><tbody id="transactions"></tbody></table></div></section><section id="stocktake" class="page"><div class="box"><h2>库存盘点</h2><div class="tools"><select id="sp"></select><select id="sw"></select><input id="actual" type="number" min="0" placeholder="实盘数量"><input id="stockRemark" placeholder="备注"><button id="stocktakeBtn">确认盘点</button></div></div></section><section id="transfer" class="page"><div class="box"><h2>仓库调拨</h2><div class="tools"><select id="tp"></select><select id="from"></select><select id="to"></select><input id="transferQty" type="number" min=".01" placeholder="数量"><input id="transferRemark" placeholder="备注"><button id="transferBtn">提交调拨</button></div></div></section><section id="account" class="page"><div class="box"><h2>账户信息</h2><table class="table"><tbody id="profile"></tbody></table></div></section><p id="msg" class="msg"></p></main><script>const $=x=>document.getElementById(x),j=async(u,o)=>{let r=await fetch(u,o);if(!r.ok)throw Error(await r.text());return r.status===204?null:r.json()},say=x=>{$('msg').textContent=x;setTimeout(()=>$('msg').textContent='',2500)};let ps=[],ws=[];document.querySelectorAll('.menu button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));$(b.dataset.page).classList.add('active');document.querySelectorAll('.menu button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(b.dataset.page==='account')profile();if(b.dataset.page==='master')masters();if(b.dataset.page==='txs')transactions()});async function load(){let d=await j('/api/dashboard');$('pc').textContent=d.products;$('wc').textContent=d.warehouses;$('bc').textContent=d.partners;$('lc').textContent=d.lowStock;ps=await j('/api/products');ws=await j('/api/warehouses');['product','sp','tp'].forEach(id=>$(id).innerHTML=ps.map(x=>`<option value=${x.id}>${x.sku} · ${x.name}</option>`).join(''));['warehouse','sw','from','to'].forEach(id=>$(id).innerHTML=ws.map(x=>`<option value=${x.id}>${x.name}</option>`).join(''));stock();charts()}async function stock(){let q=($('q')?.value||'').toLowerCase(),r=await j('/api/stock');$('stock').innerHTML=r.filter(x=>!q||[x.sku,x.barcode,x.product].some(v=>v.toLowerCase().includes(q))).map(x=>`<tr><td>${x.product} (${x.sku})</td><td>${x.warehouse}</td><td>${x.quantity} ${x.unit}</td></tr>`).join('')}async function charts(){let a=await j('/api/dashboard/alerts').catch(()=>[]);$('alerts').innerHTML=a.length?a.map(x=>`${x.product} · ${x.warehouse}：${x.quantity} / 安全库存 ${x.safetyStock}<br>`).join(''):'暂无低库存商品';let w=await j('/api/dashboard/warehouse-distribution').catch(()=>[]);$('warehouses').innerHTML=w.map(x=>`${x.warehouse} · ${x.quantity}<div class=bar><i style="width:${Math.min(100,x.percent)}%"></i></div>`).join('')}async function profile(){let x=await j('/api/account/profile');$('profile').innerHTML=`<tr><th>用户名</th><td>${x.username}</td></tr><tr><th>姓名</th><td>${x.displayName||'-'}</td></tr><tr><th>角色</th><td>${x.role}</td></tr><tr><th>电话</th><td>${x.phone||'-'}</td></tr><tr><th>最近登录</th><td>${x.lastLoginAt||'-'}</td></tr>`}async function transactions(){let r=await j('/api/transactions'),f=$('filter').value;$('transactions').innerHTML=r.filter(x=>!f||x.type===f).map(x=>`<tr><td>${x.documentNo}</td><td>${x.type}</td><td>${x.product}</td><td>${x.warehouse}</td><td>${x.quantity}</td></tr>`).join('')}$('out').onclick=async()=>{await j('/api/auth/logout',{method:'POST'});location.href='/'};$('search').onclick=stock;$('q').onkeydown=e=>e.key==='Enter'&&stock();$('submit').onclick=async()=>{try{await j('/api/transactions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({type:$('type').value,productId:+$('product').value,warehouseId:+$('warehouse').value,quantity:+$('quantity').value,remark:$('remark').value})});say('提交成功');load()}catch(e){say(e.message)}};$('stocktakeBtn').onclick=async()=>{try{let r=await j('/api/stocktakes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:+$('sp').value,warehouseId:+$('sw').value,actual:+$('actual').value,remark:$('stockRemark').value})});say('盘点完成，差异 '+r.difference);load()}catch(e){say(e.message)}};$('transferBtn').onclick=async()=>{try{await j('/api/transfers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({productId:+$('tp').value,fromWarehouseId:+$('from').value,toWarehouseId:+$('to').value,quantity:+$('transferQty').value,remark:$('transferRemark').value})});say('调拨成功');load()}catch(e){say(e.message)}};$('reloadTx').onclick=transactions;async function masters(){let [p,w,b]=await Promise.all([j('/api/products'),j('/api/warehouses'),j('/api/partners')]);$('masters').innerHTML=p.map(x=>`<tr><td>商品</td><td>${x.sku}</td><td>${x.name}</td></tr>`).concat(w.map(x=>`<tr><td>仓库</td><td>${x.code}</td><td>${x.name}</td></tr>`),b.map(x=>`<tr><td>${x.type}</td><td>${x.code}</td><td>${x.name}</td></tr>`)).join('')}async function init(){let s=await j('/api/auth/status');if(s.authenticated){$('who').textContent=s.user.Username+' · '+s.user.Role;load()}else location.href='/'}init()</script><script src="/js/lucide.js"></script><script>lucide.createIcons();</script></body></html>
